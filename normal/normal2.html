<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>健康饮食指南 - 养生网</title>
    <style>
        body { font-family: 'Microsoft YaHei', sans-serif; max-width: 900px; margin: 0 auto; padding: 20px; background: #f5f5f5; }
        .container { background: white; padding: 30px; border-radius: 8px; }
        h1 { color: #2c5f2d; border-bottom: 3px solid #2c5f2d; padding-bottom: 10px; }
        .tips { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin: 20px 0; }
        .tip-card { background: #e8f5e9; padding: 15px; border-radius: 5px; }
        img { width: 100%; max-width: 600px; display: block; margin: 20px auto; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🥗 健康饮食指南</h1>
        <img src="https://picsum.photos/600/400?random=2" alt="健康饮食">
        <h2>均衡营养的重要性</h2>
        <p>健康饮食是维持身体健康的基础。合理的饮食结构能够提供人体所需的各种营养素，增强免疫力，预防疾病。</p>

        <div class="tips">
            <div class="tip-card">
                <h3>🥦 多吃蔬菜</h3>
                <p>每天摄入500克以上的蔬菜，保证维生素和矿物质的充足供应。</p>
            </div>
            <div class="tip-card">
                <h3>🍎 适量水果</h3>
                <p>选择新鲜水果，避免果汁替代，每天200-350克为宜。</p>
            </div>
            <div class="tip-card">
                <h3>💧 充足饮水</h3>
                <p>成年人每天应饮水1500-1700毫升，保持身体水分平衡。</p>
            </div>
            <div class="tip-card">
                <h3>🌾 粗细搭配</h3>
                <p>主食应粗细粮搭配，增加膳食纤维摄入，促进肠道健康。</p>
            </div>
        </div>

        <h2>饮食建议</h2>
        <p>建议采用少油少盐的烹饪方式，多蒸煮少煎炸。控制糖分摄入，避免过度加工食品。养成良好的饮食习惯，定时定量，细嚼慢咽。</p>
    </div>
</body>
</html>
